name: Build ChenXia Kernel (Chopin)

on:
  push:
    branches: [main, master, inc_ksu]
    paths-ignore:
      - 'README.md'
      - 'build_info_*.txt'
  workflow_dispatch:

jobs:
  build:
    name: Build Kernel
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Clone Embedded Repositories & Symlink KernelSU
        run: |
          echo "Cloning KernelSU..."
          git clone --filter=blob:none https://github.com/backslashxx/KernelSU.git ${{ github.workspace }}/KernelSU
          cd ${{ github.workspace }}/KernelSU
          git checkout fab24e04496fe3e53fa3edfd4efa188a4890f509
          
          echo "Downloading and applying SUSFS De-inlined patch..."
          curl -u "Amanusa:Lan14045@" -sSL "https://monyet.fly.dev/webdav/default/KernelChopin/0001-xxKSU-kernel-implement-susfs-v2.2.0-De-inlined.patch" -o ../susfs_deinlined.patch
          git apply --exclude=kernel/Kconfig --exclude=kernel/Makefile --exclude=kernel/ksu.c ../susfs_deinlined.patch
          rm -f ../susfs_deinlined.patch

          # Manually patch the excluded files
          python3 -c "
          import os
          
          kconfig_path = 'kernel/Kconfig'
          if os.path.exists(kconfig_path):
              with open(kconfig_path, 'r', encoding='utf-8') as f:
                  kconfig = f.read().replace('\r\n', '\n')
              if 'KSU_SUSFS' not in kconfig:
                  susfs_config = '''menu \"KernelSU - SUSFS\"
config KSU_SUSFS
    bool \"KernelSU addon - SUSFS\"
    depends on KSU
    depends on THREAD_INFO_IN_TASK
    default y
    help
        Patch and Enable SUSFS to kernel with KernelSU.

config KSU_SUSFS_SUS_PATH
    bool \"Enable to hide suspicious path (NOT recommended)\"
    depends on KSU_SUSFS
    default y
    help
        - Allow hiding the user-defined path and all its sub-paths from various system calls.
        - Includes temp fix for the leaks of app path in /sdcard/Android/data directory.
        - Effective only on zygote spawned user app process.
        - Use with cautious as it may cause performance loss and will be vulnerable to side channel attacks,
          just disable this feature if it doesn't work for you or you don't need it at all.

config KSU_SUSFS_SUS_MOUNT
    bool \"Enable to hide suspicious mounts\"
    depends on KSU_SUSFS
    default y
    help
        - Allow hiding the user-defined mount paths from /proc/self/[mounts|mountinfo|mountstat].
        - Effective on all processes for hiding mount entries.
        - mnt_id and mnt_group_id of the sus mount will be assigned to a much bigger number to solve the ssue of id not being contiguous.

config KSU_SUSFS_SUS_KSTAT
    bool \"Enable to spoof suspicious kstat\"
    depends on KSU_SUSFS
    default y
    help
        - Allow spoofing the kstat of user-defined file/directory.
        - Effective only on zygote spawned user app process.

config KSU_SUSFS_TRY_UMOUNT
	bool \"Enable to use ksu's try_umount\"
	depends on KSU_SUSFS
	default y
	help
		- Allow using try_umount to umount other user-defined mount paths prior to ksu's default umount paths.
		- Effective only on zygote spawned umounted user app process.

config KSU_SUSFS_SPOOF_UNAME
    bool \"Enable to spoof uname\"
    depends on KSU_SUSFS
    default y
    help
        - Allow spoofing the string returned by uname syscall to user-defined string.
        - Effective on all processes.

config KSU_SUSFS_ENABLE_LOG
    bool \"Enable logging susfs log to kernel\"
    depends on KSU_SUSFS
    default y
    help
        - Allow logging susfs log to kernel, uncheck it to completely disable all susfs log.

config KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS
    bool \"Enable to automatically hide ksu and susfs symbols from /proc/kallsyms\"
    depends on KSU_SUSFS
    default y
    help
        - Automatically hide ksu and susfs symbols from '/proc/kallsyms'.
        - Effective on all processes.

config KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG
    bool \"Enable to spoof /proc/bootconfig (gki) or /proc/cmdline (non-gki)\"
    depends on KSU_SUSFS
    default y
    help
        - Spoof the output of /proc/bootconfig (gki) or /proc/cmdline (non-gki) with a user-defined file.
        - Effective on all processes.

config KSU_SUSFS_OPEN_REDIRECT
    bool \"Enable to redirect a path to be opened with another path (experimental)\"
    depends on KSU_SUSFS
    default y
    help
        - Allow redirecting a target path to be opened with another user-defined path.
        - Effective only on processes with uid < 2000.
        - Please be reminded that process with open access to the target and redirected path can be detected.

config KSU_SUSFS_SUS_MAP
    bool \"Enable to hide some mmapped real file from different proc maps interfaces\"
    depends on KSU_SUSFS
    default y
    help
        - Allow hiding mmapped real file from /proc/<pid>/[maps|smaps|smaps_rollup|map_files|mem|pagemap]
        - It does NOT support hiding for anon memory.
        - It does NOT hide any inline hooks or plt hooks cause by the injected library itself.
        - It may not be able to evade detections by apps that implement a good injection detection.
        - Effective only on zygote spawned umounted user app process.

endmenu

endmenu'''
                  idx = kconfig.rfind('endmenu')
                  if idx != -1:
                      kconfig = kconfig[:idx] + susfs_config + kconfig[idx+7:]
                  with open(kconfig_path, 'w', encoding='utf-8') as f:
                      f.write(kconfig)
          
          makefile_path = 'kernel/Makefile'
          if os.path.exists(makefile_path):
              with open(makefile_path, 'r', encoding='utf-8') as f:
                  makefile = f.read().rstrip()
              if 'SUSFS_VERSION' not in makefile:
                  susfs_makefile = '''
## For susfs stuff ##
ifeq ($(shell test -e $(srctree)/fs/susfs.c; echo $$?),0)
$(eval SUSFS_VERSION=$(shell cat $(srctree)/include/linux/susfs.h | grep -E '^#define SUSFS_VERSION' | cut -d' ' -f3 | sed 's/\"//g'))
$(info )
$(info -- SUSFS_VERSION: $(SUSFS_VERSION))
else
$(info -- You have not integrated susfs in your kernel yet.)
$(info -- Read: https://gitlab.com/simonpunk/susfs4ksu)
endif

# Keep a new line here!! Because someone may append config
'''
                  makefile = makefile + '\\n\\n' + susfs_makefile
                  with open(makefile_path, 'w', encoding='utf-8') as f:
                      f.write(makefile)
          
          ksuc_path = 'kernel/ksu.c'
          if os.path.exists(ksuc_path):
              with open(ksuc_path, 'r', encoding='utf-8') as f:
                  ksuc = f.read().replace('\\r\\n', '\\n')
              if 'CONFIG_KSU_SUSFS' not in ksuc:
                  target_inc = '''#ifdef CONFIG_KSU_SUSFS
#include <linux/susfs.h>
#endif // #ifdef CONFIG_KSU_SUSFS

struct cred* ksu_cred;'''
                  ksuc = ksuc.replace('struct cred* ksu_cred;', target_inc)
                  
                  target_init = '''ksu_throne_tracker_init();

#ifdef CONFIG_KSU_SUSFS
    susfs_init();
#endif // #ifdef CONFIG_KSU_SUSFS'''
                  ksuc = ksuc.replace('ksu_throne_tracker_init();', target_init)
                  with open(ksuc_path, 'w', encoding='utf-8') as f:
                      f.write(ksuc)
          "
          
          # Patch files
          python3 -c "
          import os
          apk_path = 'kernel/manager/apk_sign.c'
          with open(apk_path, 'r') as f:
              content = f.read()
          content = content.replace('strstr(pkg, \"kowx712\") != NULL', 'strstr(pkg, \"kowx712\") != NULL || strstr(pkg, \"resukisu\") != NULL || strstr(pkg, \"suki\") != NULL')
          with open(apk_path, 'w') as f:
              f.write(content)
          "
          
          cd ${{ github.workspace }}
          echo "Cloning Baseband-guard..."
          git clone -b main --depth=1 https://github.com/vc-teahouse/Baseband-guard.git ${{ github.workspace }}/Baseband-guard
          
          echo "Cloning bbrplus..."
          git clone -b master --depth=1 https://github.com/cx9208/bbrplus.git ${{ github.workspace }}/bbrplus
          
          echo "Cloning wireguard-linux-compat..."
          git clone -b master --depth=1 https://git.zx2c4.com/wireguard-linux-compat ${{ github.workspace }}/wireguard-linux-compat
          
          echo "Recreating KernelSU symlink..."
          rm -f ${{ github.workspace }}/drivers/kernelsu
          ln -s ../KernelSU/kernel ${{ github.workspace }}/drivers/kernelsu

      - name: Install Build Dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            bc bison build-essential ccache curl flex \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi \
            git libelf-dev libssl-dev lz4 zip

      - name: Set Build Variables
        run: |
          echo "ARCH=arm64" >> $GITHUB_ENV
          echo "SUBARCH=arm64" >> $GITHUB_ENV
          echo "KBUILD_BUILD_USER=ChenXia" >> $GITHUB_ENV
          echo "KBUILD_BUILD_HOST=ChenXia" >> $GITHUB_ENV
          echo "TZ=Asia/Jakarta" >> $GITHUB_ENV
          echo "LC_ALL=C" >> $GITHUB_ENV
          echo "DATE_STR=$(date '+%Y%m%d')" >> $GITHUB_ENV

      - name: Cache Clang Toolchain
        id: cache-clang
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/toolchains/clang
          key: clang-19.0.0git-20240801

      - name: Download AOSP Clang (ZyCromerZ mirror)
        if: steps.cache-clang.outputs.cache-hit != 'true'
        run: |
          mkdir -p "${{ github.workspace }}/toolchains/clang"
          echo "Fetching latest ZyCromerZ Clang 19 release..."
          LATEST=$(curl -s https://api.github.com/repos/ZyCromerZ/Clang/releases | \
            python3 -c "import sys,json; releases=json.load(sys.stdin); \
            r=[r for r in releases if '19' in r['tag_name']]; \
            print(r[0]['assets'][0]['browser_download_url'] if r else '')")
          
          if [ -z "$LATEST" ]; then
            # Fallback to known working release
            LATEST="https://github.com/ZyCromerZ/Clang/releases/download/19.0.0git-20240801-release/Clang-19.0.0git-20240801.tar.gz"
          fi

          echo "Downloading from: $LATEST"
          curl -LSs "$LATEST" -o clang.tar.gz
          tar -xf clang.tar.gz -C "${{ github.workspace }}/toolchains/clang"
          rm clang.tar.gz
          echo "Clang version:"
          "${{ github.workspace }}/toolchains/clang/bin/clang" --version

      - name: Clone AnyKernel3 (froyoandroid)
        run: |
          git clone --depth=1 https://github.com/froyoandroid/AnyKernel3 \
            "${{ github.workspace }}/AnyKernel3"

      - name: Cache CCache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-${{ github.sha }}
          restore-keys: |
            ccache-

      - name: Build NonSusFS Variant
        id: build_nonsusfs
        run: |
          CLANG_DIR="${{ github.workspace }}/toolchains/clang"
          KERNEL_DIR="${{ github.workspace }}"

          export PATH="${CLANG_DIR}/bin:$PATH"
          export KBUILD_BUILD_TIMESTAMP="$(TZ='Asia/Jakarta' date)"
          export USE_CCACHE=1
          export CCACHE_DIR=~/.ccache
          ccache -M 5G
          ccache -s

          # Set defconfig to non-susfs
          sed -i 's/^CONFIG_KSU_SUSFS=y/# CONFIG_KSU_SUSFS is not set/' \
            arch/arm64/configs/chopin_defconfig || true

          # Clean out dir
          rm -rf out && mkdir out

          # Generate config
          make O=out ARCH=arm64 chopin_defconfig

          # Build
          make -j$(nproc --all) O=out \
            ARCH=arm64 \
            CC="ccache clang" \
            HOSTCC=gcc \
            HOSTLD=ld \
            CLANG_TRIPLE=aarch64-none-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            LD=ld.lld \
            STRIP=llvm-strip \
            AS=llvm-as \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            CONFIG_NO_ERROR_ON_MISMATCH=y 2>&1 | tee error.log

          ccache -s

          if [ -f "out/arch/arm64/boot/Image.gz-dtb" ]; then
            echo "BUILD_NONSUSFS_OK=true" >> $GITHUB_ENV
          else
            echo "NonSusFS build FAILED"
            cat error.log | tail -50
            exit 1
          fi

      - name: Package NonSusFS Variant
        if: env.BUILD_NONSUSFS_OK == 'true'
        run: |
          CLANG_DIR="${{ github.workspace }}/toolchains/clang"
          CLANG_RAW=$("${CLANG_DIR}/bin/clang" --version 2>/dev/null | head -1)
          CLANG_VER=$(echo "$CLANG_RAW" | grep -oP 'clang version \K[0-9.]+' || echo "r563880c")
          KV=$(grep -m1 "^VERSION" Makefile | awk '{print $3}')
          KPL=$(grep -m1 "^PATCHLEVEL" Makefile | awk '{print $3}')
          KSL=$(grep -m1 "^SUBLEVEL" Makefile | awk '{print $3}')
          KERNEL_VER="${KV}.${KPL}.${KSL}"
          COMMIT_HASH=$(git rev-parse --short HEAD)
          BRANCH=$(git rev-parse --abbrev-ref HEAD)
          BUILD_NUM="${{ github.run_number }}"
          BUILD_NUM_PADDED=$(printf "%04d" "$BUILD_NUM")

          ZIPNAME="ChenXia-kernel-v1-${{ env.DATE_STR }}-${BUILD_NUM_PADDED}-NonSusFS.zip"

          cp out/arch/arm64/boot/Image.gz-dtb "${{ github.workspace }}/AnyKernel3/"
          cd "${{ github.workspace }}/AnyKernel3"
          zip -r9 "../${ZIPNAME}" * -x '*.git*' README.md '*placeholder' >/dev/null
          cd "${{ github.workspace }}"

          FILE_MD5=$(md5sum "${ZIPNAME}" | awk '{print $1}')

          printf "Build info:\nDevice: POCO X3 GT [chopin]\nKernel Version: %s\nCompiler: AOSP Clang %s\nBuild host: ChenXia\nCommit / Branch: (%s) / %s\nBuild variant: KSUNext / Stable (clean)\nVariant: NonSusFS\nTimestamp: %s\nMD5: %s\n" \
            "$KERNEL_VER" "$CLANG_VER" "$COMMIT_HASH" "$BRANCH" \
            "$(TZ='Asia/Jakarta' date '+%Y%m%d-%H%M')" "$FILE_MD5" > build_info_nonsusfs.txt

          echo "ZIPNAME_NONSUSFS=${ZIPNAME}" >> $GITHUB_ENV
          cat build_info_nonsusfs.txt

      - name: Build SusFS Variant
        id: build_susfs
        run: |
          CLANG_DIR="${{ github.workspace }}/toolchains/clang"

          export PATH="${CLANG_DIR}/bin:$PATH"
          export KBUILD_BUILD_TIMESTAMP="$(TZ='Asia/Jakarta' date)"
          export USE_CCACHE=1
          export CCACHE_DIR=~/.ccache
          ccache -s

          # Enable SusFS
          sed -i 's/^# CONFIG_KSU_SUSFS is not set/CONFIG_KSU_SUSFS=y/' \
            arch/arm64/configs/chopin_defconfig || true

          # We reuse the existing out directory for incremental build (much faster!)
          # Generate config with SUSFS enabled
          make O=out ARCH=arm64 chopin_defconfig

          # Build
          make -j$(nproc --all) O=out \
            ARCH=arm64 \
            CC="ccache clang" \
            HOSTCC=gcc \
            HOSTLD=ld \
            CLANG_TRIPLE=aarch64-none-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            LD=ld.lld \
            STRIP=llvm-strip \
            AS=llvm-as \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            CONFIG_NO_ERROR_ON_MISMATCH=y 2>&1 | tee error.log

          # Revert defconfig back to non-susfs (don't pollute the source)
          sed -i 's/^CONFIG_KSU_SUSFS=y/# CONFIG_KSU_SUSFS is not set/' \
            arch/arm64/configs/chopin_defconfig || true

          ccache -s

          if [ -f "out/arch/arm64/boot/Image.gz-dtb" ]; then
            echo "BUILD_SUSFS_OK=true" >> $GITHUB_ENV
          else
            echo "SusFS build FAILED"
            cat error.log | tail -50
            exit 1
          fi

      - name: Package SusFS Variant
        if: env.BUILD_SUSFS_OK == 'true'
        run: |
          CLANG_DIR="${{ github.workspace }}/toolchains/clang"
          CLANG_RAW=$("${CLANG_DIR}/bin/clang" --version 2>/dev/null | head -1)
          CLANG_VER=$(echo "$CLANG_RAW" | grep -oP 'clang version \K[0-9.]+' || echo "r563880c")
          KV=$(grep -m1 "^VERSION" Makefile | awk '{print $3}')
          KPL=$(grep -m1 "^PATCHLEVEL" Makefile | awk '{print $3}')
          KSL=$(grep -m1 "^SUBLEVEL" Makefile | awk '{print $3}')
          KERNEL_VER="${KV}.${KPL}.${KSL}"
          COMMIT_HASH=$(git rev-parse --short HEAD)
          BRANCH=$(git rev-parse --abbrev-ref HEAD)
          BUILD_NUM="${{ github.run_number }}"
          BUILD_NUM_PADDED=$(printf "%04d" "$BUILD_NUM")

          ZIPNAME="ChenXia-kernel-v1-${{ env.DATE_STR }}-${BUILD_NUM_PADDED}-SusFS.zip"

          cp out/arch/arm64/boot/Image.gz-dtb "${{ github.workspace }}/AnyKernel3/"
          cd "${{ github.workspace }}/AnyKernel3"
          zip -r9 "../${ZIPNAME}" * -x '*.git*' README.md '*placeholder' >/dev/null
          cd "${{ github.workspace }}"

          FILE_MD5=$(md5sum "${ZIPNAME}" | awk '{print $1}')

          printf "Build info:\nDevice: POCO X3 GT [chopin]\nKernel Version: %s\nCompiler: AOSP Clang %s\nBuild host: ChenXia\nCommit / Branch: (%s) / %s\nBuild variant: KSUNext / Stable (clean)\nVariant: SusFS\nTimestamp: %s\nMD5: %s\n" \
            "$KERNEL_VER" "$CLANG_VER" "$COMMIT_HASH" "$BRANCH" \
            "$(TZ='Asia/Jakarta' date '+%Y%m%d-%H%M')" "$FILE_MD5" > build_info_susfs.txt

          echo "ZIPNAME_SUSFS=${ZIPNAME}" >> $GITHUB_ENV
          cat build_info_susfs.txt

      - name: Upload Build Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kernel-zips-${{ github.run_number }}
          path: |
            ChenXia-kernel-*.zip
            build_info_*.txt
          if-no-files-found: warn

      - name: Send to Telegram
        if: env.BUILD_NONSUSFS_OK == 'true' && env.BUILD_SUSFS_OK == 'true'
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_TO }}
          COMMIT_URL: ${{ github.event.repository.html_url }}/commit/${{ github.sha }}
          ACTOR: ${{ github.actor }}
        run: |
          if [ -z "$TG_TOKEN" ] || [ -z "$TG_CHAT" ]; then
            echo "Telegram secrets not set, skipping upload."
            exit 0
          fi

          # Use shell variables derived from step/env configurations
          # Ensure we reference env variables from GITHUB_ENV correctly via shell syntax $ZIPNAME_NONSUSFS
          
          CAPTION_NS=$(printf "<b>✅ NonSusFS Build Success!</b>\n<pre>%s</pre>\n<a href=\"%s\">Commit</a> | Triggered by: %s" "$(cat build_info_nonsusfs.txt)" "$COMMIT_URL" "$ACTOR")
          
          curl -s -F chat_id="${TG_CHAT}" \
               -F document=@"${ZIPNAME_NONSUSFS}" \
               --form-string "caption=${CAPTION_NS}" \
               -F parse_mode="HTML" \
               "https://api.telegram.org/bot${TG_TOKEN}/sendDocument"

          sleep 3

          CAPTION_S=$(printf "<b>✅ SusFS Build Success!</b>\n<pre>%s</pre>\n<a href=\"%s\">Commit</a> | Triggered by: %s" "$(cat build_info_susfs.txt)" "$COMMIT_URL" "$ACTOR")

          curl -s -F chat_id="${TG_CHAT}" \
               -F document=@"${ZIPNAME_SUSFS}" \
               --form-string "caption=${CAPTION_S}" \
               -F parse_mode="HTML" \
               "https://api.telegram.org/bot${TG_TOKEN}/sendDocument"

          echo "Telegram upload done!"

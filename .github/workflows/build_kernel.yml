name: Build ChenXia Kernel (Chopin)

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Kernel (${{ matrix.variant }})
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        variant: [NonSusFS, SusFS]

    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Cache APT Packages
        uses: actions/cache@v4
        with:
          path: |
            /var/cache/apt/archives
            /var/lib/apt/lists
          key: apt-deps-v1-${{ runner.os }}
          restore-keys: |
            apt-deps-v1-

      - name: Install Build Dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential ccache curl flex \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi \
            git libelf-dev libssl-dev lz4 zip

      - name: Set Build Variables
        run: |
          echo "ARCH=arm64" >> $GITHUB_ENV
          echo "SUBARCH=arm64" >> $GITHUB_ENV
          echo "KBUILD_BUILD_USER=ChenXia" >> $GITHUB_ENV
          echo "KBUILD_BUILD_HOST=ChenXia" >> $GITHUB_ENV
          echo "TZ=Asia/Jakarta" >> $GITHUB_ENV
          echo "LC_ALL=C" >> $GITHUB_ENV
          echo "DATE_STR=$(date '+%Y%m%d')" >> $GITHUB_ENV

      - name: Cache Clang Toolchain
        id: cache-clang
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/toolchains/clang
          key: clang-19.0.0git-20240801

      - name: Download AOSP Clang (ZyCromerZ mirror)
        if: steps.cache-clang.outputs.cache-hit != 'true'
        run: |
          mkdir -p "${{ github.workspace }}/toolchains/clang"
          echo "Fetching latest ZyCromerZ Clang 19 release..."
          LATEST=$(curl -s https://api.github.com/repos/ZyCromerZ/Clang/releases | \
            python3 -c "import sys,json; releases=json.load(sys.stdin); \
            r=[r for r in releases if '19' in r['tag_name']]; \
            print(r[0]['assets'][0]['browser_download_url'] if r else '')")
          
          if [ -z "$LATEST" ]; then
            # Fallback to known working release
            LATEST="https://github.com/ZyCromerZ/Clang/releases/download/19.0.0git-20240801-release/Clang-19.0.0git-20240801.tar.gz"
          fi

          echo "Downloading from: $LATEST"
          curl -LSs "$LATEST" -o clang.tar.gz
          tar -xf clang.tar.gz -C "${{ github.workspace }}/toolchains/clang"
          rm clang.tar.gz
          echo "Clang version:"
          "${{ github.workspace }}/toolchains/clang/bin/clang" --version

      - name: Cache CCache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-${{ runner.os }}-${{ github.ref_name }}-${{ matrix.variant }}
          restore-keys: |
            ccache-${{ runner.os }}-${{ github.ref_name }}-
            ccache-${{ runner.os }}-

      - name: Build & Package Kernel Variant (${{ matrix.variant }})
        run: |
          CLANG_DIR="${{ github.workspace }}/toolchains/clang"
          export PATH="${CLANG_DIR}/bin:$PATH"
          export KBUILD_BUILD_TIMESTAMP="$(TZ='Asia/Jakarta' date)"
          export USE_CCACHE=1
          export CCACHE_DIR=~/.ccache
          export CCACHE_COMPRESS=1
          export CCACHE_COMPRESSLEVEL=1
          export CCACHE_MAXSIZE=10G
          export CCACHE_SLOPPINESS=file_macro,time_macros,include_file_mtime,include_file_ctime,pch_defines
          export CCACHE_NOHASH=1
          export CCACHE_HARDLINK=1
          ccache -s

          VARIANT="${{ matrix.variant }}"
          if [ "$VARIANT" = "SusFS" ]; then
            sed -i 's/^# CONFIG_KSU_SUSFS is not set/CONFIG_KSU_SUSFS=y/' arch/arm64/configs/chopin_defconfig || true
          else
            sed -i 's/^CONFIG_KSU_SUSFS=y/# CONFIG_KSU_SUSFS is not set/' arch/arm64/configs/chopin_defconfig || true
          fi

          mkdir -p out
          make O=out ARCH=arm64 chopin_defconfig

          make -j$(nproc --all) O=out \
            ARCH=arm64 \
            CC="ccache clang" \
            HOSTCC=gcc \
            HOSTLD=ld \
            CLANG_TRIPLE=aarch64-none-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            LD=ld.lld \
            STRIP=llvm-strip \
            AS=llvm-as \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            CONFIG_NO_ERROR_ON_MISMATCH=y 2>&1 | tee error.log

          ccache -s

          if [ ! -f "out/arch/arm64/boot/Image.gz-dtb" ]; then
            echo "Build FAILED for $VARIANT"
            cat error.log | tail -50
            exit 1
          fi

          CLANG_RAW=$("${CLANG_DIR}/bin/clang" --version 2>/dev/null | head -1)
          CLANG_VER=$(echo "$CLANG_RAW" | grep -oP 'clang version \K[0-9.]+' || echo "r563880c")
          KV=$(grep -m1 "^VERSION" Makefile | awk '{print $3}')
          KPL=$(grep -m1 "^PATCHLEVEL" Makefile | awk '{print $3}')
          KSL=$(grep -m1 "^SUBLEVEL" Makefile | awk '{print $3}')
          KERNEL_VER="${KV}.${KPL}.${KSL}"
          COMMIT_HASH=$(git rev-parse --short HEAD)
          BRANCH=$(git rev-parse --abbrev-ref HEAD)
          BUILD_NUM="${{ github.run_number }}"
          BUILD_NUM_PADDED=$(printf "%04d" "$BUILD_NUM")

          ZIPNAME="ChenXia-kernel-v1-${{ env.DATE_STR }}-${BUILD_NUM_PADDED}-${VARIANT}.zip"

          cp out/arch/arm64/boot/Image.gz-dtb "${{ github.workspace }}/AnyKernel3/"
          cd "${{ github.workspace }}/AnyKernel3"
          zip -r9 "../${ZIPNAME}" * -x '*.git*' README.md '*placeholder' >/dev/null
          cd "${{ github.workspace }}"

          FILE_MD5=$(md5sum "${ZIPNAME}" | awk '{print $1}')

          printf "Build info:\nDevice: POCO X3 GT [chopin]\nKernel Version: %s\nCompiler: AOSP Clang %s\nBuild host: ChenXia\nCommit / Branch: (%s) / %s\nBuild variant: KSUNext / Stable (clean)\nVariant: %s\nTimestamp: %s\nMD5: %s\n" \
            "$KERNEL_VER" "$CLANG_VER" "$COMMIT_HASH" "$BRANCH" \
            "$(TZ='Asia/Jakarta' date '+%Y%m%d-%H%M')" "$FILE_MD5" > "build_info_${VARIANT}.txt"

          echo "ZIPNAME=${ZIPNAME}" >> $GITHUB_ENV
          echo "VARIANT=${VARIANT}" >> $GITHUB_ENV

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ChenXia-kernel-${{ matrix.variant }}-${{ github.run_number }}
          path: |
            ChenXia-kernel-*-${{ matrix.variant }}.zip
            build_info_${{ matrix.variant }}.txt
          if-no-files-found: warn

      - name: Send to Telegram
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_TO }}
          COMMIT_URL: ${{ github.event.repository.html_url }}/commit/${{ github.sha }}
          ACTOR: ${{ github.actor }}
        run: |
          if [ -z "$TG_TOKEN" ] || [ -z "$TG_CHAT" ]; then
            echo "Telegram secrets not set, skipping upload."
            exit 0
          fi

          CAPTION=$(printf "<b>✅ %s Build Success!</b>\n<pre>%s</pre>\n<a href=\"%s\">Commit</a> | Triggered by: %s" "${{ matrix.variant }}" "$(cat build_info_${{ matrix.variant }}.txt)" "$COMMIT_URL" "$ACTOR")

          curl -s -F chat_id="${TG_CHAT}" \
               -F document=@"${{ env.ZIPNAME }}" \
               --form-string "caption=${CAPTION}" \
               -F parse_mode="HTML" \
               "https://api.telegram.org/bot${TG_TOKEN}/sendDocument"

          echo "Telegram upload done for ${{ matrix.variant }}!"
